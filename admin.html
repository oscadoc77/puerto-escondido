<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Control — Puerto Escondido</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --paper: #F1EBDC;
    --ink: #122A32;
    --ink-soft: #4C6169;
    --blue: #0C6B86;
    --gold: #D9A13C;
    --dark: #083A4B;
    --warn: #B5503B;
    --ok: #2E7D5B;
    --line: rgba(18,42,50,0.16);
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--paper); color: var(--ink); font-family: 'Work Sans', sans-serif; }
  h1, h2, h3 { font-family: 'Fraunces', serif; }
  .mono { font-family: 'IBM Plex Mono', monospace; }

  /* Login */
  .login-box {
    max-width: 380px; margin: 10vh auto; background: var(--dark); color: var(--paper);
    padding: 32px 24px; border-radius: 14px; box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    width: calc(100% - 32px);
  }
  .login-box h2 { margin-bottom: 6px; font-size: 1.5rem; }
  .login-box p { font-size: 0.85rem; color: rgba(241,235,220,0.7); margin-bottom: 22px; }
  .login-box input {
    width: 100%; padding: 12px; margin-bottom: 14px; border-radius: var(--radius);
    border: 1px solid rgba(241,235,220,0.25); background: rgba(241,235,220,0.08); color: var(--paper);
    font-size: 1rem;
  }
  .btn {
    background: var(--gold); color: var(--dark); border: none; padding: 10px 16px;
    border-radius: var(--radius); font-weight: 600; cursor: pointer; font-family: inherit;
    font-size: 0.9rem; white-space: nowrap;
  }
  .btn-full { width: 100%; }
  .btn-ghost { background: #fff; border: 1px solid var(--line); color: var(--ink); }

  /* Topbar */
  header {
    background: var(--dark); color: var(--paper); padding: 14px 20px;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
  }
  header .brand { font-family: 'Fraunces', serif; font-size: 1.15rem; line-height: 1.2; }
  header small { color: var(--gold); font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; display: block; margin-top: 2px; }

  /* Contenedor principal */
  .wrap { max-width: 1140px; margin: 0 auto; padding: 18px 16px 60px; }

  /* Barra de filtros */
  .toolbar {
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;
    gap: 10px; margin-bottom: 18px; padding-bottom: 16px; border-bottom: 1px solid var(--line);
  }
  .toolbar > div { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .toolbar input[type="date"], .toolbar input[type="text"] {
    padding: 10px 12px; border-radius: var(--radius); border: 1px solid var(--line);
    background: #fff; font-family: inherit; font-size: 0.92rem;
  }
  #buscador { min-width: 260px; }

  /* Resumen rápido (3 en fila siempre) */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
  .stat-card {
    background: #fff; padding: 14px 12px; border-radius: var(--radius); border: 1px solid var(--line);
  }
  .stat-card span {
    font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--ink-soft); font-family: 'IBM Plex Mono', monospace; display: block; line-height: 1.3;
  }
  .stat-card strong { display: block; font-size: 1.55rem; color: var(--blue); margin-top: 4px; }

  /* Tarjetas de reservación */
  .grid-reservas { display: grid; gap: 14px; }
  .res-card {
    background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 16px;
    display: grid; grid-template-columns: 90px 1.4fr 1fr 1fr; gap: 14px; align-items: center;
  }
  .hora-box {
    background: var(--dark); color: var(--gold); text-align: center; padding: 10px 6px;
    border-radius: var(--radius); font-family: 'IBM Plex Mono', monospace; font-weight: 500;
  }
  .hora-box small { display: block; color: var(--paper); font-size: 0.72rem; margin-top: 2px; }
  .badge {
    display: inline-block; font-size: 0.72rem; padding: 3px 8px; border-radius: 999px;
    font-family: 'IBM Plex Mono', monospace; font-weight: 500; vertical-align: middle;
  }
  .badge-vip { background: rgba(217,161,60,0.2); color: #8A5E0B; border: 1px solid var(--gold); }
  .badge-new { background: rgba(12,107,134,0.12); color: var(--blue); }
  .nota-box { font-size: 0.82rem; color: var(--warn); margin-top: 5px; font-style: italic; }

  select.control-inline, input.control-inline {
    width: 100%; padding: 9px 10px; border-radius: var(--radius); border: 1px solid var(--line);
    font-family: inherit; font-size: 0.9rem; background: var(--paper); margin-top: 3px;
  }
  .hidden { display: none !important; }

  /* Ajustes específicos para celular */
  @media (max-width: 768px) {
    header { padding: 12px 16px; }
    header .brand { font-size: 1.05rem; }
    header .btn-ghost { padding: 7px 11px; font-size: 0.8rem; }

    .toolbar > div {
      display: grid;
      grid-template-columns: auto 1fr;
      width: 100%;
    }
    .toolbar > div label { grid-column: 1; }
    #filtroFecha { grid-column: 2; width: 100%; }
    #btnHoy { grid-column: 1; }
    #btnTodas { grid-column: 2; width: 100%; }
    #buscador { width: 100%; min-width: 0; }

    .stats { gap: 8px; }
    .stat-card { padding: 10px 8px; text-align: center; }
    .stat-card span { font-size: 0.62rem; }
    .stat-card strong { font-size: 1.35rem; }

    .res-card { grid-template-columns: 1fr; gap: 12px; padding: 14px; }
    .hora-box { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; }
    .hora-box small { margin-top: 0; }
  }
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .chart-card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .chart-card h3 { font-family: 'IBM Plex Mono', monospace; font-size: 0.74rem; font-weight: 500; color: var(--ink-soft); margin: 0 0 8px; text-transform: uppercase; letter-spacing: 0.05em; }
  .chart-box { position: relative; height: 220px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .tab { background: #fff; border: 1px solid var(--line); color: var(--ink); padding: 10px 18px; border-radius: 999px; font-family: 'IBM Plex Mono', monospace; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; }
  .tab.active { background: var(--dark); color: var(--paper); border-color: var(--dark); }
</style>
</head>
<body>

<!-- PANTALLA DE LOGIN -->
<div id="loginView" class="login-box">
  <h2>Puerto Escondido</h2>
  <p>Acceso exclusivo para recepción y gerencia</p>
  <form id="loginForm">
    <input type="email" id="email" placeholder="Correo del restaurante" required>
    <input type="password" id="password" placeholder="Contraseña" required>
    <button type="submit" class="btn btn-full">Entrar al sistema</button>
    <p id="loginError" style="color:#E5988A; margin-top:10px; font-size:0.8rem;"></p>
  </form>
</div>

<!-- PANEL PRINCIPAL -->
<div id="appView" class="hidden">
  <header>
    <div>
      <span class="brand">Puerto Escondido — Piso y Recepción</span>
      <small id="userEmail"></small>
    </div>
    <button class="btn" style="background:rgba(241,235,220,0.12); color:var(--paper); border:1px solid rgba(241,235,220,0.35);" id="logoutBtn">Cerrar sesión</button>
  </header>

  <div class="wrap">
    <nav class="tabs">
      <button class="tab" data-tab="tabEstadisticas">Estadísticas</button>
      <button class="tab active" data-tab="tabReservaciones">Reservaciones</button>
      <button class="tab" data-tab="tabPedidos">Pedidos</button>
    </nav>

    <section id="tabEstadisticas" class="tab-panel hidden">
      <div class="stats">
        <div class="stat-card"><span>Reservaciones</span><strong id="statTotal">0</strong></div>
        <div class="stat-card"><span>Comensales esperados</span><strong id="statPersonas">0</strong></div>
        <div class="stat-card"><span>Clientes frecuentes</span><strong id="statFrecuentes">0</strong></div>
      </div>
      <div class="charts">
        <div class="chart-card"><h3>Reservaciones por día (±14 días)</h3><div class="chart-box"><canvas id="chartDias"></canvas></div></div>
        <div class="chart-card"><h3>Comensales por hora (±14 días)</h3><div class="chart-box"><canvas id="chartTurnos"></canvas></div></div>
        <div class="chart-card"><h3>Estatus de reservaciones</h3><div class="chart-box"><canvas id="chartEstados"></canvas></div></div>
        <div class="chart-card"><h3>Clientes nuevos vs frecuentes</h3><div class="chart-box"><canvas id="chartClientes"></canvas></div></div>
      </div>
    </section>

    <section id="tabReservaciones" class="tab-panel">
      <div class="toolbar">
        <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
          <label class="mono" style="font-size:0.8rem;">FECHA:</label>
          <input type="date" id="filtroFecha">
          <button class="btn" id="btnHoy">Hoy</button>
          <button class="btn btn-ghost" id="btnTodas">Ver próximas</button>
        </div>
        <input type="text" id="buscador" placeholder="Buscar cliente, folio o teléfono...">
      </div>
      <div id="listaReservas" class="grid-reservas"></div>
    </section>
    <section id="tabPedidos" class="tab-panel hidden">
      <div id="listaPedidos" class="grid-reservas"></div>
    </section>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://qrtngsebgxfgtkzudfey.supabase.co';
const SUPABASE_KEY = 'sb_publishable_uYNvIEgQk1mpEMMBJkCB8w_d3BlPuuC';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const loginView = document.getElementById('loginView');
const appView = document.getElementById('appView');
const filtroFecha = document.getElementById('filtroFecha');
const buscador = document.getElementById('buscador');
let reservasCache = [];
let modoTodas = false;

// Escapa cualquier dato que venga de la base de datos antes de insertarlo en HTML
function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function fechaLocalHoy() {
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().split('T')[0];
}
filtroFecha.value = fechaLocalHoy();

// Revisar sesión activa
async function verificarSesion() {
  const { data: { session } } = await db.auth.getSession();
  if (session) {
    loginView.classList.add('hidden');
    appView.classList.remove('hidden');
    document.getElementById('userEmail').textContent = session.user.email;
    cargarReservaciones();
    cargarGraficas();
    suscribirTiempoReal();
  } else {
    loginView.classList.remove('hidden');
    appView.classList.add('hidden');
  }
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const { error } = await db.auth.signInWithPassword({ email, password });
  if (error) {
    document.getElementById('loginError').textContent = 'Correo o contraseña incorrectos.';
  } else {
    verificarSesion();
  }
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  if (canalTiempoReal) { db.removeChannel(canalTiempoReal); canalTiempoReal = null; }
  await db.auth.signOut();
  verificarSesion();
});

async function cargarReservaciones() {
  let query = db
    .from('reservaciones')
    .select(`
      id, folio, fecha, hora, personas, mesa_asignada, estado, notas_reserva, nombre_reserva,
      clientes ( id, nombre, telefono, total_visitas, notas_permanentes )
    `)
    .order('fecha', { ascending: true })
    .order('hora', { ascending: true });

  if (!modoTodas && filtroFecha.value) {
    query = query.eq('fecha', filtroFecha.value);
  } else {
    query = query.gte('fecha', fechaLocalHoy());
  }

  const { data, error } = await query;
  if (error) {
    console.error(error);
    return;
  }
  reservasCache = data || [];
  renderizar();
}

function renderizar() {
  const q = buscador.value.toLowerCase().trim();
  const filtradas = reservasCache.filter(r => {
    if (!q) return true;
    return (
      r.folio.toLowerCase().includes(q) ||
      r.clientes?.nombre?.toLowerCase().includes(q) ||
      r.clientes?.telefono?.includes(q)
    );
  });

  document.getElementById('statTotal').textContent = filtradas.length;
  document.getElementById('statPersonas').textContent = filtradas.reduce((acc, r) => acc + r.personas, 0);
  document.getElementById('statFrecuentes').textContent = filtradas.filter(r => (r.clientes?.total_visitas || 1) > 1).length;

  const cont = document.getElementById('listaReservas');
  if (filtradas.length === 0) {
    cont.innerHTML = '<p style="color:var(--ink-soft); padding:20px 0;">No hay reservaciones registradas para este filtro.</p>';
    return;
  }

  cont.innerHTML = filtradas.map(r => {
    const c = r.clientes || {};
    const visitas = c.total_visitas || 1;
    const badge = visitas > 1
      ? `<span class="badge badge-vip">★ Frecuente (${visitas} visitas)</span>`
      : `<span class="badge badge-new">Primera visita</span>`;

    return `
      <div class="res-card">
        <div class="hora-box">
          <div>${esc(r.hora).slice(0,5)}</div>
          <small>${esc(r.fecha)}</small>
        </div>

        <div>
          <strong style="font-size:1.05rem;">${esc(r.nombre_reserva || c.nombre || 'Cliente')}</strong> ${badge}
          ${r.nombre_reserva && c.nombre && r.nombre_reserva !== c.nombre ? `<span class="mono" style="font-size:0.75rem; color:var(--ink-soft);"> · ficha: ${esc(c.nombre)}</span>` : ''}
          <div class="mono" style="font-size:0.8rem; color:var(--ink-soft); margin-top:4px;">
            ${esc(r.folio)} · ${esc(r.personas)} pers. · Tel: <a href="tel:${esc(c.telefono)}">${esc(c.telefono)}</a>
          </div>
          <button class="btn btn-ghost" style="padding:4px 10px; font-size:0.78rem; margin-top:6px;" data-unir="${esc(c.id)}" data-nombre="${esc(c.nombre || '')}">Unir esta ficha con otra</button>
          ${r.notas_reserva ? `<div class="nota-box">Nota reserva: "${esc(r.notas_reserva)}"</div>` : ''}
          ${c.notas_permanentes ? `<div class="nota-box" style="color:var(--blue)">Historial cliente: "${esc(c.notas_permanentes)}"</div>` : ''}
        </div>

        <div>
          <label class="mono" style="font-size:0.68rem; color:var(--ink-soft);">MESA ASIGNADA</label>
          <input class="control-inline" type="text" value="${esc(r.mesa_asignada)}"
            data-id="${esc(r.id)}" data-campo="mesa_asignada"
            placeholder="Ej. Mesa 4, Terraza...">
        </div>

        <div>
          <label class="mono" style="font-size:0.68rem; color:var(--ink-soft);">ESTATUS</label>
          <select class="control-inline" data-id="${esc(r.id)}" data-campo="estado">
            <option value="pendiente"  ${r.estado==='pendiente'?'selected':''}>🟡 Pendiente</option>
            <option value="confirmada" ${r.estado==='confirmada'?'selected':''}>🔵 Confirmada</option>
            <option value="en_mesa"    ${r.estado==='en_mesa'?'selected':''}>🟢 Ya en mesa</option>
            <option value="completada" ${r.estado==='completada'?'selected':''}>⚪ Completada</option>
            <option value="cancelada"  ${r.estado==='cancelada'?'selected':''}>🔴 Cancelada / No llegó</option>
          </select>
        </div>
      </div>
    `;
  }).join('');
}

async function actualizarReserva(id, cambios) {
  const { error } = await db.from('reservaciones').update(cambios).eq('id', id);
  if (error) {
    alert('No se pudo guardar el cambio. Revisa la conexión e inténtalo de nuevo.');
    cargarReservaciones();
    return;
  }
  cargarGraficas();
}

// Unir dos fichas de cliente (la que se borra se pasa a la que se conserva)
document.getElementById('listaReservas').addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-unir]');
  if (!btn) return;
  const origenId = btn.dataset.unir;
  const origenNombre = btn.dataset.nombre;

  const tel = prompt(`Unir la ficha de "${origenNombre}" con otra.\n\nEscribe el teléfono de la ficha que SE CONSERVA (10 dígitos):`);
  if (!tel) return;
  const telLimpio = tel.replace(/\D/g, '');
  if (!/^\d{10}$/.test(telLimpio)) { alert('El teléfono debe tener 10 dígitos.'); return; }

  const { data: destino, error: errBusqueda } = await db
    .from('clientes').select('id, nombre, telefono, total_visitas')
    .eq('telefono', telLimpio).maybeSingle();
  if (errBusqueda || !destino) { alert('No encontré una ficha con ese teléfono.'); return; }
  if (destino.id === origenId) { alert('Esa es la misma ficha.'); return; }

  const ok = confirm(`Se pasarán todas las reservaciones de "${origenNombre}" a la ficha "${destino.nombre}" (${destino.telefono}).\n\nLa ficha de "${origenNombre}" se borrará. ¿Continuar?`);
  if (!ok) return;

  const { error } = await db.rpc('unir_clientes', { p_origen: origenId, p_destino: destino.id });
  if (error) { alert('No se pudo unir las fichas: ' + error.message); return; }
  cargarReservaciones();
  cargarGraficas();
});

// Un solo listener para todos los controles de la lista
document.getElementById('listaReservas').addEventListener('change', (e) => {
  const el = e.target;
  if (!el.dataset || !el.dataset.id) return;
  // Actualiza la pantalla al instante; si el guardado falla, actualizarReserva recarga los datos reales
  const r = reservasCache.find(x => x.id === el.dataset.id);
  if (r) { r[el.dataset.campo] = el.value; renderizar(); }
  actualizarReserva(el.dataset.id, { [el.dataset.campo]: el.value });
});

// Actualización automática en tiempo real cuando cae una reserva nueva
let canalTiempoReal = null;
function suscribirTiempoReal() {
  if (canalTiempoReal) return;
  canalTiempoReal = db.channel('cambios-reservas')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'reservaciones' }, () => {
      cargarReservaciones();
      cargarGraficas();
    })
    .subscribe();
}

filtroFecha.addEventListener('change', () => { modoTodas = false; cargarReservaciones(); });
document.getElementById('btnHoy').addEventListener('click', () => { modoTodas = false; filtroFecha.value = fechaLocalHoy(); cargarReservaciones(); });
document.getElementById('btnTodas').addEventListener('click', () => { modoTodas = true; cargarReservaciones(); });
buscador.addEventListener('input', renderizar);

verificarSesion();

// ===== GRÁFICAS =====
const COLORES = { azul: '#0C6B86', dorado: '#D9A13C', oscuro: '#083A4B', verde: '#2E7D5B', rojo: '#B5503B', gris: '#8A9BA1' };
const ESTADOS = [
  { id: 'pendiente', label: 'Pendiente', color: COLORES.dorado },
  { id: 'confirmada', label: 'Confirmada', color: COLORES.azul },
  { id: 'en_mesa', label: 'En mesa', color: COLORES.oscuro },
  { id: 'completada', label: 'Completada', color: COLORES.verde },
  { id: 'cancelada', label: 'Cancelada', color: COLORES.rojo }
];
const instanciasGraficas = {};

function sumarDias(iso, n) {
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function opcionesBarras() {
  return {
    responsive: true,
    maintainAspectRatio: false,
    plugins: { legend: { display: false } },
    scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
  };
}

function opcionesDona() {
  return { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } } };
}

function dibujarGrafica(id, config) {
  if (typeof Chart === 'undefined') return;
  if (instanciasGraficas[id]) {
    instanciasGraficas[id].data = config.data;
    instanciasGraficas[id].update();
  } else {
    instanciasGraficas[id] = new Chart(document.getElementById(id), config);
  }
}

async function cargarGraficas() {
  const hoy = fechaLocalHoy();
  const { data, error } = await db
    .from('reservaciones')
    .select('fecha, hora, personas, estado, cliente_id, clientes ( total_visitas )')
    .gte('fecha', sumarDias(hoy, -14))
    .lte('fecha', sumarDias(hoy, 14));
  if (error) { console.error(error); return; }
  const filas = data || [];

  // 1) Reservaciones por día
  const etiquetasDias = [];
  const conteoDias = [];
  for (let i = -14; i <= 14; i++) {
    const f = sumarDias(hoy, i);
    etiquetasDias.push(f.slice(8) + '/' + f.slice(5, 7));
    conteoDias.push(filas.filter(r => r.fecha === f).length);
  }
  dibujarGrafica('chartDias', {
    type: 'bar',
    data: { labels: etiquetasDias, datasets: [{ label: 'Reservaciones', data: conteoDias, backgroundColor: COLORES.azul, borderRadius: 4 }] },
    options: opcionesBarras()
  });

  // 2) Comensales por hora
  const porHora = {};
  filas.forEach(r => {
    const h = r.hora.slice(0, 2) + ':00';
    porHora[h] = (porHora[h] || 0) + r.personas;
  });
  const horas = Object.keys(porHora).sort();
  dibujarGrafica('chartTurnos', {
    type: 'bar',
    data: { labels: horas, datasets: [{ label: 'Comensales', data: horas.map(h => porHora[h]), backgroundColor: COLORES.dorado, borderRadius: 4 }] },
    options: opcionesBarras()
  });

  // 3) Estatus de las reservaciones
  dibujarGrafica('chartEstados', {
    type: 'doughnut',
    data: {
      labels: ESTADOS.map(e => e.label),
      datasets: [{ data: ESTADOS.map(e => filas.filter(r => r.estado === e.id).length), backgroundColor: ESTADOS.map(e => e.color), borderWidth: 0 }]
    },
    options: opcionesDona()
  });

  // 4) Clientes únicos: primera visita vs frecuentes (2 o más visitas completadas)
  const clientes = new Map();
  filas.forEach(r => { if (r.cliente_id) clientes.set(r.cliente_id, r.clientes?.total_visitas || 1); });
  let nuevos = 0, frecuentes = 0;
  clientes.forEach(v => { if (v > 1) frecuentes++; else nuevos++; });
  dibujarGrafica('chartClientes', {
    type: 'doughnut',
    data: {
      labels: ['Primera visita', 'Frecuentes'],
      datasets: [{ data: [nuevos, frecuentes], backgroundColor: [COLORES.gris, COLORES.verde], borderWidth: 0 }]
    },
    options: opcionesDona()
  });
}

// ===== PESTAÑAS =====
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b === btn));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('hidden', p.id !== btn.dataset.tab));
    // Las gráficas dibujadas en una pestaña oculta necesitan recalcular su tamaño
    Object.values(instanciasGraficas).forEach(c => c.resize());
    if (btn.dataset.tab === 'tabPedidos') cargarPedidos();
  });
});

// ===== PEDIDOS PARA RECOGER =====
const ESTADOS_PEDIDO = [
  { id: 'nuevo', label: 'Nuevo' },
  { id: 'pagado', label: 'Pagado' },
  { id: 'entregado', label: 'Entregado' },
  { id: 'cancelado', label: 'Cancelado' }
];

async function cargarPedidos() {
  const cont = document.getElementById('listaPedidos');
  const { data, error } = await db
    .from('pedidos')
    .select('id, folio, detalle, total, estado, notas, creado_en, clientes ( nombre, telefono )')
    .order('creado_en', { ascending: false })
    .limit(100);
  if (error) { cont.innerHTML = '<p class="mono">No se pudieron cargar los pedidos.</p>'; return; }
  renderPedidos(data || []);
}

function renderPedidos(lista) {
  const cont = document.getElementById('listaPedidos');
  if (!lista.length) { cont.innerHTML = '<p class="mono">Todavía no hay pedidos.</p>'; return; }
  cont.innerHTML = lista.map(p => {
    const c = p.clientes || {};
    const items = (p.detalle || []).map(d =>
      `<li>${esc(d.cantidad)} × ${esc(d.nombre)}${d.variante ? ' (' + esc(d.variante) + ')' : ''}${d.unidad ? ' · ' + esc(d.unidad) : ''} — $${esc(d.subtotal)}</li>`
    ).join('');
    const opciones = ESTADOS_PEDIDO.map(e =>
      `<option value="${e.id}" ${p.estado === e.id ? 'selected' : ''}>${e.label}</option>`).join('');
    const fecha = new Date(p.creado_en).toLocaleString('es-MX', { dateStyle: 'short', timeStyle: 'short' });
    return `
      <div class="res-card">
        <div class="hora-box">
          <div>$${esc(p.total)}</div>
          <small>${esc(p.folio)}</small>
        </div>
        <div>
          <strong style="font-size:1.05rem;">${esc(c.nombre || 'Cliente')}</strong>
          <div class="mono" style="font-size:0.8rem; color:var(--ink-soft); margin-top:4px;">
            Tel: <a href="tel:${esc(c.telefono)}">${esc(c.telefono)}</a> · ${esc(fecha)} · Pago en sucursal
          </div>
          <ul style="margin:8px 0 0; padding-left:18px; font-size:0.9rem;">${items}</ul>
          ${p.notas ? `<div class="nota-box">Notas: "${esc(p.notas)}"</div>` : ''}
        </div>
        <div>
          <label class="mono" style="font-size:0.72rem; color:var(--ink-soft);">ESTADO</label>
          <select class="control-inline" data-pedido="${esc(p.id)}">${opciones}</select>
        </div>
      </div>`;
  }).join('');
}

document.getElementById('listaPedidos').addEventListener('change', async (e) => {
  const id = e.target.dataset.pedido;
  if (!id) return;
  const { error } = await db.from('pedidos').update({ estado: e.target.value }).eq('id', id);
  if (error) { alert('No se pudo guardar el estado del pedido.'); cargarPedidos(); }
});
</script>
